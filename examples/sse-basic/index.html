<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSE Basic</title>
    <script>
      // Follow the OS theme without a toggle (@antfu/design dark: is class-based).
      document.documentElement.classList.toggle(
        'dark',
        window.matchMedia('(prefers-color-scheme: dark)').matches,
      )
    </script>
  </head>
  <body class="h-full m0 bg-base color-base">
    <div class="mx-auto max-w-xl p6">
      <h1 class="m0 mb1 flex items-center gap-1.5 text-lg font-semibold">
        <span class="i-ph-broadcast-duotone text-xl color-active"></span>
        <span>SSE Basic</span>
      </h1>
      <p class="m0 mb5 text-sm color-muted">
        An SSE-only devframe (<code class="font-mono">ws: false</code>) — every RPC frame below rides plain HTTP at
        <a class="font-mono color-active" href="/__sse-basic/__connection.json">/__sse-basic/</a>, no WebSocket anywhere.
      </p>

      <dl class="m0 grid grid-cols-[auto_1fr] items-center gap-x-4 gap-y-2 rounded-lg border border-base bg-secondary p4 text-sm">
        <dt class="color-muted">Transport</dt>
        <dd id="transport" class="m0 font-mono">connecting…</dd>
        <dt class="color-muted">Server clock</dt>
        <dd id="clock" class="m0 font-mono">—</dd>
        <dt class="color-muted">Server uptime</dt>
        <dd id="uptime" class="m0 font-mono">—</dd>
      </dl>

      <div class="mt4 flex items-center gap-3">
        <button id="increment" class="btn-action text-sm">Increment on the server</button>
        <span id="count" class="text-sm font-mono color-muted"></span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
