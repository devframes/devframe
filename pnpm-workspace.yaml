# The `comark-docs` layer (docs site theme, installed from GitHub) pins its
# `comark`/`comark-content`/`@comark/nuxt` deps to pkg.pr.new snapshot URLs,
# which pnpm 11 classifies as exotic subdependencies and blocks by default.
# There is no per-package allowlist for this setting.
blockExoticSubdeps: false
allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  sharp: false
  simple-git-hooks: true
  unrs-resolver: true
  vue-demi: true
catalogMode: prefer
cleanupUnusedCatalogs: true
ignoreWorkspaceRootCheck: true
minimumReleaseAgeExclude:
  - nostics@1.1.4
  - '@antfu/design@0.3.0 || 0.3.2'
  - crossws@0.4.8
  - iframe-pane@1.1.0
  - tsdown@0.22.14
  - verkit@0.3.0
  - structured-clone-es@2.0.1
  - '@devframes/hub-ui@0.9.4'
  - '@devframes/hub@0.9.4'
  - '@devframes/json-render@0.9.4'
  - '@devframes/vite@0.9.4'
shamefullyHoist: true
shellEmulator: true
strictPeerDependencies: false
trustPolicy: no-downgrade
trustPolicyExclude:
  - tinyexec@1.2.2
  - '@vercel/functions@3.9.3'
  - '@vercel/functions@3.9.5'
  - '@vercel/oidc@3.8.4'
  - '@vercel/oidc@3.8.5'
  - '@vercel/cli-config@0.2.3'
  - '@vercel/cli-config@0.2.4'
  - '@vercel/cli-exec@1.0.1'
packages:
  - packages/*
  - plugins/*
  - plugins/*/assets-pkg
  - services/*
  - examples/*
  - starter
  - storybook
  - docs

refs:
  nuxt: &nuxt ^4.5.2
  storybook: &storybook ^10.5.8
  unocss: &unocss ^66.7.5
  vueuse: &vueuse ^14.4.0

overrides:
  '@devframes/hub': 'workspace:*'
  '@devframes/hub-ui': 'workspace:*'
  '@devframes/json-render': 'workspace:*'
  '@devframes/json-render-ui': 'workspace:*'
  '@devframes/next': 'workspace:*'
  '@devframes/nuxt': 'workspace:*'
  '@devframes/plugin-a11y': 'workspace:*'
  '@devframes/plugin-assets': 'workspace:*'
  '@devframes/plugin-code-server': 'workspace:*'
  '@devframes/plugin-data-inspector': 'workspace:*'
  '@devframes/plugin-git': 'workspace:*'
  '@devframes/plugin-inspect': 'workspace:*'
  '@devframes/plugin-messages': 'workspace:*'
  '@devframes/plugin-og': 'workspace:*'
  '@devframes/plugin-terminals': 'workspace:*'
  '@devframes/service-git': 'workspace:*'
  '@devframes/service-open': 'workspace:*'
  '@devframes/service-shiki': 'workspace:*'
  '@devframes/vite': 'workspace:*'
  chokidar: ^5.0.0
  crossws: ^0.4.12
  devframe: 'workspace:*'
  semver: ^7.8.5
  shell-quote: ^1.10.0

update:
  ignoreDeps:
    - typescript@7
patchedDependencies:
  comark-docs@0.0.1: patches/comark-docs@0.0.1.patch
catalogs:
