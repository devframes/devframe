allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  sharp: false
  simple-git-hooks: true
  unrs-resolver: true
  vue-demi: true
catalogMode: prefer
cleanupUnusedCatalogs: true
ignoreWorkspaceRootCheck: true
minimumReleaseAgeExclude:
  - nostics@1.1.4
  - '@antfu/design@0.3.0 || 0.3.2'
  - crossws@0.4.8
  - iframe-pane@1.1.0
  - tsdown@0.22.14
  - verkit@0.3.0
  - structured-clone-es@2.0.1
shamefullyHoist: true
shellEmulator: true
strictPeerDependencies: false
trustPolicy: no-downgrade
trustPolicyExclude:
  - tinyexec@1.2.2
  - '@pierre/theme@1.1.0'
packages:
  - packages/*
  - plugins/*
  - plugins/*/assets-pkg
  - services/*
  - examples/*
  - storybook
  - docs

refs:
  nuxt: &nuxt ^4.5.2
  storybook: &storybook ^10.5.7
  unocss: &unocss ^66.7.5
  vueuse: &vueuse ^14.4.0

overrides:
  '@devframe/hub': 'workspace:*'
  '@devframe/json-render': 'workspace:*'
  '@devframe/json-render-ui': 'workspace:*'
  '@devframe/next': 'workspace:*'
  '@devframe/nuxt': 'workspace:*'
  '@devframe/plugin-a11y': 'workspace:*'
  '@devframe/plugin-assets': 'workspace:*'
  '@devframe/plugin-code-server': 'workspace:*'
  '@devframe/plugin-data-inspector': 'workspace:*'
  '@devframe/plugin-git': 'workspace:*'
  '@devframe/plugin-inspect': 'workspace:*'
  '@devframe/plugin-messages': 'workspace:*'
  '@devframe/plugin-og': 'workspace:*'
  '@devframe/plugin-terminals': 'workspace:*'
  chokidar: ^5.0.0
  crossws: ^0.4.10
  devframe: 'workspace:*'
  semver: ^7.8.5
  shell-quote: ^1.10.0

