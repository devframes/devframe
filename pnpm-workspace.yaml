ignoreWorkspaceRootCheck: true
catalogMode: prefer
cleanupUnusedCatalogs: true
# The `comark-docs` layer (docs site theme, installed from GitHub) pins its
# `comark`/`comark-content`/`@comark/nuxt` deps to pkg.pr.new snapshot URLs,
# which pnpm 11 classifies as exotic subdependencies and blocks by default.
# There is no per-package allowlist for this setting.
blockExoticSubdeps: false

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - vite@8.3.3
  - '@antfu/design@0.6.0'
  - '@shikijs/core@4.5.0'
  - '@shikijs/engine-javascript@4.5.0'
  - '@shikijs/engine-oniguruma@4.5.0'
  - '@shikijs/langs@4.5.0'
  - '@shikijs/magic-move@4.5.0'
  - '@shikijs/primitive@4.5.0'
  - '@shikijs/themes@4.5.0'
  - '@shikijs/types@4.5.0'
  - shiki@4.5.0
  - magic-string@1.4.3
  - reka-ui@2.11.0
  - '@modelcontextprotocol/client@2.3.1'
  - '@modelcontextprotocol/core@2.3.1'
  - '@modelcontextprotocol/server@2.3.1'
  - '@radix-ui/react-presence@1.1.11'
  - axe-core@4.14.0
  - launch-editor@2.14.2
  - '@x18n/builtins@0.0.9'
  - '@x18n/cli@0.0.9'
  - '@x18n/core@0.0.9'
  - '@x18n/node@0.0.9'
  - '@x18n/ui@0.0.9'

trustPolicy: no-downgrade
trustPolicyExclude:
  - tinyexec@1.2.2
  - '@vercel/functions@3.9.3'
  - '@vercel/functions@3.9.5'
  - '@vercel/oidc@3.8.4'
  - '@vercel/oidc@3.8.5'
  - '@vercel/cli-config@0.2.3'
  - '@vercel/cli-config@0.2.4'
  - '@vercel/cli-exec@1.0.1'

update:
  ignoreDeps:
    - typescript@7

strictPeerDependencies: false
shamefullyHoist: true
shellEmulator: true

packages:
  - packages/*
  - plugins/*
  - plugins/*/assets-pkg
  - services/*
  - examples/*
  - starter
  - storybook
  - docs

overrides:
  '@devframes/agentic': 'workspace:*'
  '@devframes/hub': 'workspace:*'
  '@devframes/hub-ui': 'workspace:*'
  '@devframes/hub-ui-onboard': 'workspace:*'
  '@devframes/json-render': 'workspace:*'
  '@devframes/json-render-ui': 'workspace:*'
  '@devframes/next': 'workspace:*'
  '@devframes/nuxt': 'workspace:*'
  '@devframes/plugin-a11y': 'workspace:*'
  '@devframes/plugin-assets': 'workspace:*'
  '@devframes/plugin-code-server': 'workspace:*'
  '@devframes/plugin-data-inspector': 'workspace:*'
  '@devframes/plugin-git': 'workspace:*'
  '@devframes/plugin-inspect': 'workspace:*'
  '@devframes/plugin-messages': 'workspace:*'
  '@devframes/plugin-og': 'workspace:*'
  '@devframes/plugin-terminals': 'workspace:*'
  '@devframes/service-git': 'workspace:*'
  '@devframes/service-open': 'workspace:*'
  '@devframes/service-shiki': 'workspace:*'
  '@devframes/vite': 'workspace:*'
  # Nuxt bundles DevTools v3. The docs dogfood v4, which runs on the local devframe hub.
  '@nuxt/devtools': &nuxtDevtools ^4.0.0-beta.7
  '@unhead/vue': ^3.4.3
  chokidar: ^5.0.0
  crossws: ^0.4.15
  devframe: 'workspace:*'
  nuxt: &nuxt ^4.6.2
  satori: catalog:docs
  semver: ^7.8.5
  shell-quote: ^1.12.0
  storybook: &storybook ^10.6.3
  unhead: ^3.4.3
  unocss: &unocss ^66.11.0
  '@unocss/core': *unocss
  vueuse: &vueuse ^14.4.0

patchedDependencies:
  comark-docs@0.0.1: patches/comark-docs@0.0.1.patch

allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  sharp: false
  simple-git-hooks: true
  unrs-resolver: true
  vue-demi: true

